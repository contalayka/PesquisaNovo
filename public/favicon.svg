<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Top Face Gradient: Electric Cyan to Royal Blue -->
    <linearGradient id="mpTopGrad" x1="120" y1="70" x2="392" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Left Face Gradient: Vibrant Violet Purple to Azure Blue -->
    <linearGradient id="mpLeftGrad" x1="120" y1="145" x2="256" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Right Face Gradient: Deep Tech Navy with Ambient Bevel -->
    <linearGradient id="mpRightGrad" x1="256" y1="145" x2="392" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Arrow Gradient: Glowing Neon Cyan to Turquoise -->
    <linearGradient id="mpArrowGrad" x1="324" y1="330" x2="324" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="mpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="#050B16" />

  <!-- Soft Ambient Radial Glow behind Cube -->
  <circle cx="256" cy="240" r="180" fill="#00F0FF" opacity="0.12" filter="url(#mpGlow)" />
  <circle cx="180" cy="300" r="140" fill="#A855F7" opacity="0.15" filter="url(#mpGlow)" />

  <!-- 3D Isometric Cube -->
  <g id="isometric-cube" filter="drop-shadow(0 14px 24px rgba(0,0,0,0.6))">
    <!-- Top Face (Rhombus) -->
    <path
      d="M256 78
         C262 74 270 74 276 78
         L386 138
         C394 142 396 150 392 156
         L268 226
         C261 230 251 230 244 226
         L120 156
         C116 150 118 142 126 138
         Z"
      fill="url(#mpTopGrad)"
    />

    <!-- Left Face -->
    <path
      d="M118 162
         C116 166 116 172 118 178
         L118 316
         C118 326 126 334 136 339
         L242 396
         C248 399 254 397 254 390
         L254 238
         C254 233 250 229 246 227
         Z"
      fill="url(#mpLeftGrad)"
    />

    <!-- Right Face (Housing the Arrow Cutout) -->
    <path
      d="M266 238
         L266 390
         C266 397 272 400 278 396
         L384 339
         C394 334 402 326 402 316
         L402 178
         C404 172 404 166 402 162
         L274 234
         C270 236 266 237 266 238
         Z"
      fill="url(#mpRightGrad)"
    />

    <!-- Upward Arrow Cutout on Right Face -->
    <path
      d="M336 200
         C339 196 345 196 348 200
         L380 234
         C384 238 381 245 376 245
         L356 245
         L356 312
         C356 316 352 320 348 320
         L328 320
         C324 320 320 316 320 312
         L320 245
         L300 245
         C295 245 292 238 296 234
         Z"
      fill="url(#mpArrowGrad)"
      filter="drop-shadow(0 0 10px rgba(0,240,255,0.75))"
    />

    <!-- Internal Bevel Highlight Line -->
    <path
      d="M256 230 L256 392"
      stroke="#38BDF8"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.4"
    />
  </g>
</svg>
