<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%" fx="35%" fy="25%">
      <stop offset="0%" stop-color="#0F2444" />
      <stop offset="50%" stop-color="#071426" />
      <stop offset="100%" stop-color="#050B16" />
    </radialGradient>

    <!-- Top Face Gradient: Electric Cyan to Royal Blue -->
    <linearGradient id="topGrad" x1="280" y1="130" x2="520" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Left Face Gradient: Violet Purple to Deep Indigo -->
    <linearGradient id="leftGrad" x1="280" y1="200" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Right Face Gradient: Deep Navy with Ambient Edge -->
    <linearGradient id="rightGrad" x1="400" y1="200" x2="540" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="35%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <!-- Arrow Gradient: Glowing Neon Cyan -->
    <linearGradient id="arrowGrad" x1="470" y1="390" x2="470" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Prep Text Gradient -->
    <linearGradient id="prepGrad" x1="480" y1="540" x2="650" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cubeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="35" flood-color="#00F0FF" flood-opacity="0.25" />
    </filter>

    <!-- Arrow Glow -->
    <filter id="arrowGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00F0FF" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="800" rx="48" fill="url(#bgGlow)" />

  <!-- Ambient Light Accents -->
  <circle cx="200" cy="150" r="220" fill="#3B82F6" opacity="0.1" filter="blur(40px)" />
  <circle cx="650" cy="650" r="250" fill="#7C3AED" opacity="0.12" filter="blur(50px)" />

  <!-- 3D Isometric Cube Container -->
  <g id="logo-cube" filter="url(#cubeShadow)">
    <!-- Top Face (Isometric Rhombus) -->
    <path
      d="M400 135
         C406 131 414 131 420 135
         L534 198
         C542 202 544 210 540 216
         L414 288
         C407 292 393 292 386 288
         L260 216
         C256 210 258 202 266 198
         Z"
      fill="url(#topGrad)"
    />

    <!-- Left Face -->
    <path
      d="M258 224
         C256 228 256 234 258 240
         L258 376
         C258 386 266 394 276 399
         L384 456
         C390 459 398 457 398 450
         L398 296
         C398 291 394 287 390 285
         Z"
      fill="url(#leftGrad)"
    />

    <!-- Right Face (With Arrow Window) -->
    <path
      d="M408 296
         L408 450
         C408 457 416 460 422 456
         L530 399
         C540 394 548 386 548 376
         L548 240
         C550 234 550 228 548 224
         L416 292
         C412 294 408 295 408 296
         Z"
      fill="url(#rightGrad)"
    />

    <!-- Internal Seam Line -->
    <path
      d="M400 290 L400 454"
      stroke="#38BDF8"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.35"
    />

    <!-- Upward Arrow Cutout inside Right Face -->
    <path
      d="M480 262
         C483 258 489 258 492 262
         L524 296
         C528 300 525 307 520 307
         L500 307
         L500 376
         C500 380 496 384 492 384
         L468 384
         C464 384 460 380 460 376
         L460 307
         L440 307
         C435 307 432 300 436 296
         Z"
      fill="url(#arrowGrad)"
      filter="url(#arrowGlow)"
    />
  </g>

  <!-- Typography Group: MarketPrep -->
  <g id="brand-text">
    <text
      x="400"
      y="575"
      text-anchor="middle"
      font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif"
      font-weight="800"
      font-size="78"
      letter-spacing="-0.03em"
    >
      <tspan fill="#FFFFFF">Market</tspan>
      <tspan fill="url(#prepGrad)">Prep</tspan>
    </text>

    <!-- Subtitle: Catálogo • Conversão • Marketplaces -->
    <text
      x="400"
      y="635"
      text-anchor="middle"
      font-family="'Inter', system-ui, sans-serif"
      font-weight="600"
      font-size="20"
      letter-spacing="0.16em"
      fill="#94A3B8"
      opacity="0.9"
    >
      CATÁLOGO  •  CONVERSÃO  •  MARKETPLACES
    </text>
  </g>
</svg>
