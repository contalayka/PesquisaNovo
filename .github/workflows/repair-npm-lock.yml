name: Repair npm lockfile
on:
  push:
    branches:
      - feature/neon-dashboard-redesign
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feature/neon-dashboard-redesign
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fix npm lockfile for dashboard redesign dependencies"
          git push origin HEAD:feature/neon-dashboard-redesign
