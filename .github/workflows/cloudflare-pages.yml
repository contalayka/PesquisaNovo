name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Normalize Cloudflare Credentials
        shell: bash
        env:
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RAW_ID="${CF_ACCOUNT_SECRET##*/}"
          RAW_ID="$(echo "$RAW_ID" | tr -d '[:space:]')"
          ACCOUNT_ID="${RAW_ID:-e96d79c77b6c34295d3ea8a08dbf1812}"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          CLEAN_TOKEN="$(echo "$CF_TOKEN_SECRET" | tr -d '\r\n ')"
          if [ -n "$CLEAN_TOKEN" ]; then
            echo "::add-mask::$CLEAN_TOKEN"
            echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name "Pesquisa produto"
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
