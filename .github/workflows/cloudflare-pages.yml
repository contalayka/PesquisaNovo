name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Normalize Cloudflare Credentials
        shell: bash
        env:
          CF_ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RAW_ID="${CF_ACCOUNT_SECRET##*/}"
          RAW_ID="$(echo "$RAW_ID" | tr -d '[:space:]')"
          ACCOUNT_ID="${RAW_ID:-e96d79c77b6c34295d3ea8a08dbf1812}"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

          CLEAN_TOKEN="$(echo "$CF_TOKEN_SECRET" | tr -d '\r\n ')"
          if [ -n "$CLEAN_TOKEN" ]; then
            echo "::add-mask::$CLEAN_TOKEN"
            echo "CLOUDFLARE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Cloudflare Pages (with rate-limit retry)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx --yes wrangler@4.148.0 --version
          delays=(0 30 60 120)
          for delay in "${delays[@]}"; do
            if [ "$delay" -gt 0 ]; then
              echo "Cloudflare rate limit: aguardando ${delay}s antes da nova tentativa..."
              sleep "$delay"
            fi

            echo "Deploy Cloudflare Pages..."
            if npx --yes wrangler@4.148.0 pages deploy dist --project-name "Pesquisa produto" --branch main; then
              echo "Deploy Cloudflare Pages concluído."
              exit 0
            fi

            echo "Tentativa falhou; aguardando antes de tentar novamente."
          done

          echo "Não foi possível publicar no Cloudflare Pages após todas as tentativas."
          exit 1
